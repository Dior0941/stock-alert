<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>押し目アラート MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:auto;padding:20px 14px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0}button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;background:#007aff;color:#fff}
button.secondary{background:#e5e5ea;color:#1d1d1f}button.danger{background:#ff3b30}
.notice{background:#fff8d8;border:1px solid #eadb8b;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between}.code{font-size:12px;color:#777}.name{font-size:18px;font-weight:700}.price{font-size:25px;font-weight:700;margin:14px 0 8px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}.hit{color:#d70015;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.demo{margin-top:12px;font-size:12px;color:#777}
.empty{text-align:center;padding:40px;color:#777}
dialog{width:min(92vw,480px);border:0;border-radius:18px;padding:0;box-shadow:0 12px 50px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.4)}
.modal{padding:20px}.modal h2{margin:0 0 16px;font-size:19px}label{display:block;font-size:13px;color:#555;margin:11px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:9px;font-size:16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:600px){.wrap{padding:14px 10px 30px}header{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📈 押し目アラート</h1><button id="addStockButton" type="button">＋ 銘柄追加</button></header>
<div class="notice">現在はMVP（試作版）です。表示価格はデモ値で、実際の株価APIやプッシュ通知にはまだ接続していません。銘柄・目標価格などはこのブラウザのLocalStorageに保存されます。</div>
<main id="stockList" class="grid"></main>
</div>

<dialog id="stockDialog">
<div class="modal">
<h2 id="dialogTitle">銘柄追加</h2>
<label for="codeInput">銘柄コード</label><input id="codeInput" inputmode="numeric" autocomplete="off" placeholder="例：4005">
<label for="nameInput">銘柄名</label><input id="nameInput" autocomplete="off" placeholder="例：住友化学">
<label for="priceInput">現在値（デモ）</label><input id="priceInput" type="number" inputmode="decimal" step="0.1">
<label for="target1Input">押し目目標①</label><input id="target1Input" type="number" inputmode="decimal" step="0.1">
<label for="target2Input">押し目目標②</label><input id="target2Input" type="number" inputmode="decimal" step="0.1">
<div class="modal-actions"><button id="cancelButton" class="secondary" type="button">キャンセル</button><button id="saveButton" type="button">保存</button></div>
</div>
</dialog>

<script>
(function(){
"use strict";

const stockList=document.getElementById("stockList");
const addStockButton=document.getElementById("addStockButton");
const stockDialog=document.getElementById("stockDialog");
const dialogTitle=document.getElementById("dialogTitle");
const codeInput=document.getElementById("codeInput");
const nameInput=document.getElementById("nameInput");
const priceInput=document.getElementById("priceInput");
const target1Input=document.getElementById("target1Input");
const target2Input=document.getElementById("target2Input");
const cancelButton=document.getElementById("cancelButton");
const saveButton=document.getElementById("saveButton");
const STORAGE_KEY="dipAlertStocks_v2";
let editingId=null;

function makeId(){
 if(window.crypto && typeof window.crypto.randomUUID==="function") return window.crypto.randomUUID();
 return "id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}

const defaults=[
["4005","住友化学",569,550,520],["7011","三菱重工",3788,3600,3400],
["5801","古河電工",3670,3400,3100],["5016","JX金属",3500,3300,3000],
["5020","ENEOS",1389,1330,1250],["5401","日本製鉄",656,630,590],
["2914","JT",6900,6700,6400],["8316","三井住友FG",3360,3200,3000],
["4499","Skyfall",1921,1650,1500],["5889","akippa",2105,1800,1500]
].map(x=>({id:makeId(),code:x[0],name:x[1],price:x[2],t1:x[3],t2:x[4]}));

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(stocks))}
function load(){
 try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(x))return x}catch(e){}
 localStorage.setItem(STORAGE_KEY,JSON.stringify(defaults));return defaults;
}
let stocks=load();

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function yen(v){return Number(v).toLocaleString("ja-JP")+"円"}

function render(){
 stockList.innerHTML="";
 if(!stocks.length){stockList.innerHTML='<div class="empty">銘柄がありません。<br>「＋ 銘柄追加」から登録してください。</div>';return}
 stocks.forEach(s=>{
  const p=Number(s.price),a=Number(s.t1),b=Number(s.t2);
  const h1=p<=a,h2=p<=b;
  const card=document.createElement("section");card.className="card";
  card.innerHTML='<div class="top"><div><div class="code">'+esc(s.code)+'</div><div class="name">'+esc(s.name)+'</div></div></div>'+
   '<div class="price">'+yen(p)+'</div>'+
   '<div class="row"><span>目標①</span><strong class="'+(h1?"hit":"")+'">'+yen(a)+(h1?" 🔔 到達":"")+'</strong></div>'+
   '<div class="row"><span>目標②</span><strong class="'+(h2?"hit":"")+'">'+yen(b)+(h2?" 🔔 到達":"")+'</strong></div>'+
   '<div class="actions"><button type="button" data-action="down" data-id="'+s.id+'">現在値 −1%</button>'+
   '<button type="button" class="secondary" data-action="up" data-id="'+s.id+'">現在値 ＋1%</button>'+
   '<button type="button" class="secondary" data-action="edit" data-id="'+s.id+'">編集</button>'+
   '<button type="button" class="danger" data-action="delete" data-id="'+s.id+'">削除</button></div>'+
   '<div class="demo">※現在値はデモ値</div>';
  stockList.appendChild(card);
 });
}

function openDialog(){
 if(typeof stockDialog.showModal==="function")stockDialog.showModal();
 else{stockDialog.setAttribute("open","");stockDialog.style.position="fixed";stockDialog.style.top="50%";stockDialog.style.left="50%";stockDialog.style.transform="translate(-50%,-50%)"}
}
function closeDialog(){
 if(typeof stockDialog.close==="function")stockDialog.close();else stockDialog.removeAttribute("open");
 editingId=null;
}
function add(){
 editingId=null;dialogTitle.textContent="銘柄追加";
 [codeInput,nameInput,priceInput,target1Input,target2Input].forEach(x=>x.value="");
 openDialog();codeInput.focus();
}
function edit(id){
 const s=stocks.find(x=>x.id===id);if(!s)return;
 editingId=id;dialogTitle.textContent="銘柄編集";
 codeInput.value=s.code;nameInput.value=s.name;priceInput.value=s.price;target1Input.value=s.t1;target2Input.value=s.t2;
 openDialog();codeInput.focus();
}
function saveForm(){
 const code=codeInput.value.trim(),name=nameInput.value.trim(),p=Number(priceInput.value),a=Number(target1Input.value),b=Number(target2Input.value);
 if(!code||!name){alert("銘柄コードと銘柄名を入力してください。");return}
 if(![p,a,b].every(Number.isFinite)){alert("価格を正しく入力してください。");return}
 if(editingId){
  const i=stocks.findIndex(x=>x.id===editingId);if(i>=0)stocks[i]={id:editingId,code,name,price:p,t1:a,t2:b};
 }else stocks.push({id:makeId(),code,name,price:p,t1:a,t2:b});
 save();render();closeDialog();
}
function change(id,rate){
 const s=stocks.find(x=>x.id===id);if(!s)return;s.price=Math.round(Number(s.price)*(1+rate)*10)/10;save();render();
}
function del(id){
 const s=stocks.find(x=>x.id===id);if(!s)return;if(!confirm(s.name+"を削除しますか？"))return;
 stocks=stocks.filter(x=>x.id!==id);save();render();
}

addStockButton.addEventListener("click",add);
cancelButton.addEventListener("click",closeDialog);
saveButton.addEventListener("click",saveForm);
stockList.addEventListener("click",e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;
 const a=b.dataset.action,id=b.dataset.id;
 if(a==="edit")edit(id);else if(a==="delete")del(id);else if(a==="down")change(id,-.01);else if(a==="up")change(id,.01);
});
stockDialog.addEventListener("cancel",e=>{e.preventDefault();closeDialog()});
render();
})();
</script>
</body>
</html>
